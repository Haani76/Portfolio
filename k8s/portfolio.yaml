# Runs the portfolio image on any Kubernetes cluster:  kubectl apply -f k8s/
# The image is built and published to GitHub Container Registry by .github/workflows/ci.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  labels: { app: portfolio }
spec:
  replicas: 2
  selector:
    matchLabels: { app: portfolio }
  template:
    metadata:
      labels: { app: portfolio }
    spec:
      containers:
        - name: web
          image: ghcr.io/haani76/portfolio:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
spec:
  selector: { app: portfolio }
  ports:
    - port: 80
      targetPort: 3000
